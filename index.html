<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>黄硕 · 简历</title>
<meta name="description" content="黄硕 — AI 架构师 / 应用开发工程师 简历" />
<style>
  :root {
    --ink: #151a21;
    --muted: #5c6672;
    --accent: #0b6b5d;
    --accent-soft: #e7f2ef;
    --line: #e4e1d9;
    --bg: #f2efe9;
    --paper: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 13.5px;
    line-height: 1.68;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  a {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(11, 107, 93, 0.28);
  }
  a:hover { border-bottom-color: var(--accent); }

  .toolbar {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toolbar .hint {
    font-size: 12px;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    backdrop-filter: blur(6px);
  }

  .btn {
    appearance: none;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(11, 107, 93, 0.18);
  }
  .btn:hover { background: #09584d; border-color: #09584d; }
  .btn:active { transform: translateY(1px); }

  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 40px auto;
    padding: 18mm 17mm 16mm;
    background: var(--paper);
    box-shadow: 0 18px 48px rgba(24, 30, 38, 0.10), 0 2px 6px rgba(24, 30, 38, 0.06);
  }

  .identity { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }

  .name {
    font-size: 34px;
    line-height: 1.15;
    letter-spacing: 0.02em;
    font-weight: 700;
    margin: 0;
  }

  .name .en {
    display: inline-block;
    margin-left: 10px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: var(--muted);
    vertical-align: 4px;
  }

  .title {
    margin: 8px 0 0;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.02em;
  }

  .meta {
    margin: 14px 0 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    font-size: 12px;
    color: var(--muted);
  }
  .meta a { color: var(--muted); border-bottom-color: transparent; }
  .meta a:hover { color: var(--accent); border-bottom-color: rgba(11, 107, 93, 0.28); }

  .contact {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.9;
    min-width: 150px;
  }
  .contact a { color: var(--muted); }
  .contact a:hover { color: var(--accent); }

  .rule {
    height: 1px;
    background: var(--line);
    margin: 18px 0 0;
  }

  section { margin-top: 24px; }

  h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: var(--ink);
  }
  h2::before {
    content: "";
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 2px;
    flex: none;
  }
  h2 .en {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--muted);
  }

  .summary { margin: 0; }

  .skill-row {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 10px;
    padding: 3px 0;
  }
  .skill-row dt {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.04em;
  }
  .skill-row dd {
    margin: 0;
    color: #2b333d;
  }
  .skill-row .sep { color: #b9c0c6; margin: 0 6px; }

  .exp { margin-bottom: 16px; }
  .exp:last-child { margin-bottom: 0; }

  .exp-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 4px;
  }
  .exp-role {
    font-size: 14px;
    font-weight: 700;
    margin: 0;
  }
  .exp-role .company {
    color: var(--ink);
  }
  .exp-role .at { color: var(--muted); font-weight: 400; margin: 0 6px; }
  .exp-role .company a { color: inherit; border-bottom-color: rgba(21, 26, 33, 0.2); }

  .exp-period {
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .exp-loc {
    font-size: 11.5px;
    color: var(--muted);
    margin: 0 0 6px;
  }

  ul.bullets {
    margin: 6px 0 0;
    padding: 0;
    list-style: none;
  }
  ul.bullets li {
    position: relative;
    padding-left: 14px;
    margin: 4px 0;
  }
  ul.bullets li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 0.72em;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.72;
  }

  .project {
    display: grid;
    grid-template-columns: 168px 1fr;
    gap: 12px;
    padding: 7px 0;
    border-top: 1px dashed var(--line);
  }
  .project:first-of-type { border-top: 0; padding-top: 0; }
  .project:last-of-type { padding-bottom: 0; }

  .project-name {
    font-weight: 700;
    font-size: 13px;
    line-height: 1.45;
  }
  .project-role {
    display: block;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-top: 2px;
  }
  .project-desc { color: #2b333d; }

  .edu {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }
  .edu-school { font-weight: 700; font-size: 13.5px; }
  .edu-degree { color: var(--muted); margin-left: 8px; font-weight: 400; }
  .edu-period { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

  .footer {
    margin-top: 30px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 10.5px;
    color: #8a939d;
    letter-spacing: 0.04em;
  }

  .loading, .error {
    padding: 40px 0;
    text-align: center;
    color: var(--muted);
  }
  .error code {
    background: var(--accent-soft);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--accent);
  }

  @media (max-width: 820px) {
    .page {
      width: auto;
      min-height: 0;
      margin: 0;
      padding: 28px 20px 32px;
      box-shadow: none;
    }
    .toolbar { position: static; justify-content: flex-end; padding: 12px 12px 0; }
    .identity { flex-direction: column; }
    .contact { text-align: left; }
    .skill-row { grid-template-columns: 1fr; gap: 2px; }
    .project { grid-template-columns: 1fr; gap: 2px; }
  }

  @page {
    size: A4;
    margin: 14mm 15mm 12mm;
  }

  @media print {
    body { background: #fff; font-size: 10.5pt; line-height: 1.6; }
    .toolbar, .hint { display: none !important; }
    .page {
      width: auto;
      min-height: 0;
      margin: 0;
      padding: 0;
      box-shadow: none;
    }
    a { color: inherit; border-bottom: 0; }
    section { margin-top: 16px; }
    .exp { margin-bottom: 11px; }
    .exp, .project, .edu, .skill-row { break-inside: avoid; }
    h2 { break-after: avoid; }
    .footer { margin-top: 16px; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="hint">打印对话框里选「另存为 PDF」</span>
  <button class="btn" onclick="window.print()">导出 PDF</button>
</div>

<main class="page" id="resume">
  <div class="loading">正在加载简历数据…</div>
</main>

<script>
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[ch]));

const link = (href, text) =>
  href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);

function render(data) {
  const b = data.basics || {};
  const contactBits = [];
  if (b.email) contactBits.push(link(`mailto:${b.email}`, b.email));
  if (b.phone) contactBits.push(esc(b.phone));

  const skills = (data.skills || []).map((row) => `
    <div class="skill-row">
      <dt>${esc(row.group)}</dt>
      <dd>${(row.items || []).map((item) => `<span>${esc(item)}</span>`).join('<span class="sep">·</span>')}</dd>
    </div>`).join("");

  const experience = (data.experience || []).map((job) => `
    <article class="exp">
      <div class="exp-head">
        <h3 class="exp-role"><span class="company">${esc(job.company)}</span><span class="at">·</span>${esc(job.role)}</h3>
        <span class="exp-period">${esc(job.period)}</span>
      </div>
      ${job.location ? `<p class="exp-loc">${esc(job.location)}</p>` : ""}
      ${(job.highlights || []).length ? `<ul class="bullets">${job.highlights.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
    </article>`).join("");

  const projects = (data.opensource || []).map((p) => `
    <div class="project">
      <div class="project-name">
        ${link(p.link, p.name)}
        <span class="project-role">${esc(p.role)}</span>
      </div>
      <div class="project-desc">${esc(p.description)}</div>
    </div>`).join("");

  const education = (data.education || []).map((e) => `
    <div class="edu">
      <div><span class="edu-school">${esc(e.school)}</span><span class="edu-degree">${esc(e.degree)}</span></div>
      <span class="edu-period">${esc(e.period)}</span>
    </div>`).join("");

  document.title = `${b.name || "简历"} · 简历`;
  document.getElementById("resume").innerHTML = `
    <header class="identity">
      <div>
        <h1 class="name">${esc(b.name)}${b.englishName ? `<span class="en">${esc(b.englishName)}</span>` : ""}</h1>
        <p class="title">${esc(b.title)}</p>
        <div class="meta">
          ${b.location ? `<span>${esc(b.location)}</span>` : ""}
          ${b.linkedin ? `<span>${link(b.linkedin, "LinkedIn")}</span>` : ""}
          ${b.github ? `<span>${link(b.github, "github.com/shuo-huge")}</span>` : ""}
        </div>
      </div>
      ${contactBits.length ? `<aside class="contact">${contactBits.join("<br>")}</aside>` : ""}
    </header>
    <div class="rule"></div>

    ${b.summary ? `<section><h2>个人简介 <span class="en">PROFILE</span></h2><p class="summary">${esc(b.summary)}</p></section>` : ""}
    ${skills ? `<section><h2>核心能力 <span class="en">SKILLS</span></h2><dl style="margin:0">${skills}</dl></section>` : ""}
    ${experience ? `<section><h2>工作经历 <span class="en">EXPERIENCE</span></h2>${experience}</section>` : ""}
    ${projects ? `<section><h2>开源项目 <span class="en">OPEN SOURCE</span></h2>${projects}</section>` : ""}
    ${education ? `<section><h2>教育背景 <span class="en">EDUCATION</span></h2>${education}</section>` : ""}

    <footer class="footer">
      <span>最近更新：${esc(data.lastUpdated || "")}</span>
    </footer>`;
}

fetch("resume.json", { cache: "no-cache" })
  .then((res) => {
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  })
  .then(render)
  .catch((err) => {
    document.getElementById("resume").innerHTML = `
      <div class="error">
        <p>无法加载 <code>resume.json</code>（${esc(err.message)}）。</p>
        <p>本地预览请在该目录运行 <code>python -m http.server 8080</code>，再访问 <code>http://localhost:8080</code>。</p>
      </div>`;
  });
</script>
</body>
</html>
